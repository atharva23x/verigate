# Render Blueprint - provisions the VeriGate API from this repo.
#
# Render dashboard -> New + -> Web Service -> connect the GitHub repo ->
# "Use render.yaml" (Blueprint) -> Apply. Everything below is then automatic.
services:
  - type: web
    name: verigate-api          # final URL: https://verigate-api.onrender.com
    runtime: python
    plan: free                  # 512 MB RAM, 750 h/month, sleeps after 15 min idle
    rootDir: backend
    buildCommand: pip install -r requirements-lite.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"        # same version the project is tested with
      - key: MOCK_MODE
        value: "True"           # demo safeguard: never depends on heavy OCR/ML
      - key: SEED_ON_STARTUP
        value: "True"           # seeds 30 synthetic applications in the BACKGROUND
      - key: JWT_SECRET
        generateValue: true     # unique random secret per environment
      - key: VERIGATE_DB
        value: /tmp/verigate.db           # ephemeral: reseeded after a restart
      - key: VERIGATE_STORAGE
        value: /tmp/verigate-storage
