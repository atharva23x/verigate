# Render Blueprint - provisions the VeriGate API and Frontend from this repo.
#
# Render dashboard -> Blueprints -> Connect repo / Sync -> Apply
services:
  - type: web
    name: verigate-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-lite.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: MOCK_MODE
        value: "True"
      - key: SEED_ON_STARTUP
        value: "True"
      - key: JWT_SECRET
        generateValue: true
      - key: VERIGATE_DB
        value: /tmp/verigate.db
      - key: VERIGATE_STORAGE
        value: /tmp/verigate-storage

  - type: web
    name: verigate-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://verigate-api-8ejd.onrender.com
