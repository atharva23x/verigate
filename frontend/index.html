<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VeriGate - AI decision-support for AICTE Extension of Approval validation. The Evidence Gate abstains when evidence is weak; humans make the final call."
    />
    <meta name="theme-color" content="#0f172a" />
    <title>VeriGate - AICTE EoA Validation</title>
    <script>
      // Apply the saved theme before first paint (default: dark).
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("vg-theme");
        } catch (e) {}
        document.documentElement.setAttribute(
          "data-theme",
          t === "light" ? "light" : "dark"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
